<svg viewBox="0 0 440 180" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
  <defs>
    <!-- Background Layer (Hazy Distant Architectural Silhouette) -->
    <linearGradient id="mSkyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Midground Architectural Layer -->
    <linearGradient id="mSkyMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Foreground Premium Architectural Glass Tones -->
    <linearGradient id="mToneNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#2c3b52"/>
      <stop offset="100%" stop-color="#3b4d66"/>
    </linearGradient>

    <linearGradient id="mToneSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="55%" stop-color="#33475e"/>
      <stop offset="100%" stop-color="#445b77"/>
    </linearGradient>

    <linearGradient id="mToneSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#2d3f56"/>
      <stop offset="100%" stop-color="#3e536e"/>
    </linearGradient>

    <linearGradient id="mToneGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#2b4c73"/>
      <stop offset="100%" stop-color="#3b5e87"/>
    </linearGradient>

    <!-- Metallic Spire Finish -->
    <linearGradient id="mSpireSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Warm Glowing Micro-Windows -->
    <linearGradient id="mWinWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Soft Cyan Glass Reflection -->
    <linearGradient id="mWinCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Distant Background Skyline Silhouette (Continuous & Atmospheric) -->
  <g fill="url(#mSkyBg)">
    <rect x="0" y="110" width="440" height="70"/>
    <polygon points="0,180 0,90 28,75 28,180"/>
    <rect x="32" y="65" width="34" height="115"/>
    <polygon points="48,65 49,38 50,65"/>
    <polygon points="75,180 75,60 112,42 112,180"/>
    <rect x="135" y="52" width="38" height="128"/>
    <polygon points="153,52 154,28 155,52"/>
    <path d="M 185 180 L 185 65 Q 205 48 225 65 L 225 180 Z"/>
    <polygon points="255,180 255,48 295,72 295,180"/>
    <rect x="315" y="56" width="36" height="124"/>
    <polygon points="332,56 333,32 334,56"/>
    <rect x="368" y="70" width="38" height="110"/>
    <polygon points="386,70 387,45 388,70"/>
    <rect x="415" y="78" width="25" height="102"/>
  </g>

  <!-- LAYER 2: Midground Modern Architectural Towers (Continuous Depth) -->
  <g fill="url(#mSkyMid)">
    <rect x="0" y="125" width="440" height="55"/>
    <polygon points="0,180 0,98 38,72 38,180"/>
    <rect x="45" y="85" width="42" height="95"/>
    <rect x="53" y="62" width="26" height="23"/>
    <polygon points="65.5,62 66,42 66.5,62"/>
    <path d="M 98 180 L 98 70 Q 120 52 142 70 L 142 180 Z"/>
    <polygon points="152,180 152,78 200,52 200,180"/>
    <rect x="210" y="72" width="44" height="108"/>
    <rect x="220" y="48" width="24" height="24"/>
    <line x1="232" y1="48" x2="232" y2="28" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="268,180 268,58 318,85 318,180"/>
    <rect x="325" y="80" width="45" height="100"/>
    <rect x="335" y="58" width="25" height="22"/>
    <polygon points="347,58 347.5,38 348,58"/>
    <rect x="382" y="92" width="58" height="88"/>
  </g>

  <!-- LAYER 3: Foreground 7 Premium Architectural Glass Skyscraper Titans -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.1" stroke-linejoin="round">

    <!-- 1. Tapered Chamfered Modern Glass Tower (x=0 to x=68) -->
    <g fill="url(#mToneGlass)">
      <polygon points="0,180 12,42 48,42 64,180"/>
      <!-- Inner chamfer line -->
      <line x1="30" y1="42" x2="0" y2="180" stroke="rgba(255,255,255,0.3)"/>
      <line x1="30" y1="42" x2="64" y2="180" stroke="rgba(255,255,255,0.18)"/>
      <!-- Crown Spire -->
      <rect x="25" y="34" width="10" height="8" fill="#334155"/>
      <polygon points="29.4,34 30,8 30.6,34" fill="url(#mSpireSteel)"/>
      <g id="m-beacon-t1">
    <circle cx="30" cy="8" r="5" fill="#ff3b30" opacity="0.3">
      <animate attributeName="r" values="2;5.5;2" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.06;0.7" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="30" cy="8" r="1.6" fill="#ff453a">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
  </g>
    </g>

    <!-- 2. Curved Modern Architectural Skyscraper (x=55 to x=126, Overlaps #1 and #3) -->
    <g fill="url(#mToneSteel)">
      <path d="M 55 180 C 55 110, 70 54, 88 38 C 106 54, 126 110, 126 180 Z"/>
      <path d="M 82 50 Q 88 38 94 50 Z" fill="#1e293b"/>
      <!-- Modern Diagrid Glass Bands -->
      <path d="M 60 145 Q 88 125 118 105" stroke="rgba(255,255,255,0.3)" fill="none"/>
      <path d="M 118 145 Q 88 125 60 105" stroke="rgba(255,255,255,0.3)" fill="none"/>
      <path d="M 66 105 Q 88 85 110 65" stroke="rgba(255,255,255,0.3)" fill="none"/>
      <path d="M 110 105 Q 88 85 66 65" stroke="rgba(255,255,255,0.3)" fill="none"/>
    </g>

    <!-- 3. Stepped Art Deco Glass Skyscraper with Sunburst Spire (x=115 to x=186, Overlaps #2 and #4) -->
    <g fill="url(#mToneNavy)">
      <rect x="115" y="90" width="71" height="90"/>
      <rect x="124" y="62" width="53" height="28"/>
      <!-- Sunburst Terraced Crown -->
      <path d="M 128 62 Q 150.5 48 173 62 Z" fill="#334155"/>
      <path d="M 132 52 Q 150.5 38 169 52 Z" fill="#475569"/>
      <path d="M 137 42 Q 150.5 28 164 42 Z" fill="#64748b"/>
      <path d="M 143 32 Q 150.5 18 158 32 Z" fill="#94a3b8"/>
      <!-- Stainless Steel Needle Spire -->
      <polygon points="149.8,18 150.5,4 151.2,18" fill="url(#mSpireSteel)"/>
   <g id="m-beacon-chrysler">
    <circle cx="150.5" cy="4" r="5" fill="#ffffff" opacity="0.35">
      <animate attributeName="r" values="2;6;2" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.85;0.04;0.85" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="150.5" cy="4" r="1.6" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
   </g>
      <polygon points="124,62 119,59 124,65" fill="url(#mSpireSteel)"/>
      <polygon points="177,62 182,59 177,65" fill="url(#mSpireSteel)"/>
    </g>

    <!-- 4. THE EMPIRE STATE BUILDING / HERO CENTERPIECE (x=175 to x=262, Overlaps #3 and #5) -->
    <g fill="url(#mToneNavy)">
      <rect x="175" y="92" width="87" height="88"/>
      <rect x="185" y="66" width="67" height="26"/>
      <rect x="195" y="38" width="47" height="28"/>
      <rect x="203" y="18" width="31" height="20"/>
      <rect x="211" y="8" width="15" height="10" fill="#475569"/>
      <!-- Mooring Mast & Aircraft Beacon -->
      <polygon points="217.8,8 218.5,1 219.2,8" fill="url(#mSpireSteel)"/>
      <g id="m-beacon-empire">
    <circle cx="218.5" cy="1.5" r="6" fill="#ff3b30" opacity="0.35">
      <animate attributeName="r" values="2.2;7;2.2" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.05;0.8" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="218.5" cy="1.5" r="1.8" fill="#ff453a">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite" />
    </circle>
  </g>
    </g>

    <!-- 5. Modern 45-Degree Angled Wedge Glass Tower (x=250 to x=325, Overlaps #4 and #6) -->
    <g fill="url(#mToneGlass)">
      <polygon points="250,180 250,38 325,98 325,180"/>
      <line x1="250" y1="38" x2="325" y2="98" stroke="url(#mSpireSteel)" stroke-width="1.8"/>
      <!-- Vertical Sunshade Fins -->
      <line x1="268" y1="52" x2="268" y2="180" stroke="rgba(255,255,255,0.2)"/>
      <line x1="286" y1="67" x2="286" y2="180" stroke="rgba(255,255,255,0.2)"/>
      <line x1="304" y1="81" x2="304" y2="180" stroke="rgba(255,255,255,0.2)"/>
    </g>

    <!-- 6. Slender Grid Glass Skyscraper with Open Mechanical Cuts (x=312 to x=378, Overlaps #5 and #7) -->
    <g fill="url(#mToneSteel)">
      <rect x="316" y="26" width="56" height="154"/>
      <!-- Open Mechanical Cutout Bands -->
      <rect x="316" y="62" width="56" height="8" fill="#03091e" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
      <rect x="316" y="110" width="56" height="8" fill="#03091e" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
      <!-- Spire Mast -->
      <rect x="338" y="18" width="12" height="8" fill="#384c63"/>
      <line x1="344" y1="18" x2="344" y2="6" stroke="#cbd5e1" stroke-width="1.5"/>
      <g id="m-beacon-t6">
    <circle cx="344" cy="6" r="4.5" fill="#ff3b30" opacity="0.3">
      <animate attributeName="r" values="1.8;5;1.8" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.08;0.7" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="344" cy="6" r="1.4" fill="#ff453a">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
  </g>
    </g>

    <!-- 7. Stepped Modern Architectural High-Rise (x=365 to x=440, Overlaps #6 to Right Edge) -->
    <g fill="url(#mToneSlate)">
      <rect x="365" y="85" width="75" height="95"/>
      <rect x="375" y="58" width="55" height="27"/>
      <rect x="388" y="38" width="30" height="20"/>
      <polygon points="402.4,38 403,20 403.6,38" fill="url(#mSpireSteel)"/>
      <g id="m-beacon-t7">
    <circle cx="403" cy="20" r="5" fill="#fbbf24" opacity="0.3">
      <animate attributeName="r" values="2;5.5;2" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.08;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="403" cy="20" r="1.6" fill="#fef08a" stroke="#f59e0b" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>
    </g>

  </g>

  <!-- Architectural Details: Vertical Mullions & Warm Illuminated Windows -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1">
    <line x1="203" y1="38" x2="203" y2="180"/>
    <line x1="210" y1="38" x2="210" y2="180"/>
    <line x1="218.5" y1="38" x2="218.5" y2="180"/>
    <line x1="227" y1="38" x2="227" y2="180"/>
    <line x1="234" y1="38" x2="234" y2="180"/>
    <!-- Art Deco Tower Mullions -->
    <line x1="138" y1="62" x2="138" y2="180"/>
    <line x1="150.5" y1="62" x2="150.5" y2="180"/>
    <line x1="163" y1="62" x2="163" y2="180"/>
  </g>

  <!-- Warm Illuminated Micro-Windows (Mobile Living Night Skyline) -->
  <g fill="url(#mWinWarm)">
    <!-- Steady Ambient Windows -->
    <g id="m-win-steady">
      <!-- Tower 1: Tapered Glass Tower -->
      <rect x="25" y="65" width="3" height="4.5" rx="0.5"/>
      <rect x="35" y="65" width="3" height="4.5" rx="0.5"/>
      <rect x="25" y="85" width="3" height="4.5" rx="0.5"/>
      <rect x="35" y="85" width="3" height="4.5" rx="0.5"/>
      <rect x="25" y="105" width="3" height="4.5" rx="0.5"/>
      <rect x="35" y="105" width="3" height="4.5" rx="0.5"/>

      <!-- Tower 3: Art Deco Tower -->
      <rect x="135" y="104" width="2.5" height="4.5" rx="0.5"/>
      <rect x="149" y="104" width="2.5" height="4.5" rx="0.5"/>
      <rect x="163" y="104" width="2.5" height="4.5" rx="0.5"/>
      <rect x="135" y="122" width="2.5" height="4.5" rx="0.5"/>
      <rect x="149" y="122" width="2.5" height="4.5" rx="0.5"/>
      <rect x="163" y="122" width="2.5" height="4.5" rx="0.5"/>
      <rect x="135" y="140" width="2.5" height="4.5" rx="0.5"/>
      <rect x="149" y="140" width="2.5" height="4.5" rx="0.5"/>
      <rect x="163" y="140" width="2.5" height="4.5" rx="0.5"/>

      <!-- Tower 4: Empire State Building -->
      <rect x="206" y="98" width="2.5" height="5" rx="0.5"/>
      <rect x="217" y="98" width="2.5" height="5" rx="0.5"/>
      <rect x="228" y="98" width="2.5" height="5" rx="0.5"/>
      <rect x="206" y="116" width="2.5" height="5" rx="0.5"/>
      <rect x="217" y="116" width="2.5" height="5" rx="0.5"/>
      <rect x="228" y="116" width="2.5" height="5" rx="0.5"/>
      <rect x="206" y="134" width="2.5" height="5" rx="0.5"/>
      <rect x="217" y="134" width="2.5" height="5" rx="0.5"/>
      <rect x="228" y="134" width="2.5" height="5" rx="0.5"/>

      <!-- Tower 6: Grid Glass Tower Matrix -->
      <rect x="325" y="38" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="338" y="38" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="351" y="38" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="325" y="48" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="338" y="48" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="351" y="48" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="325" y="80" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="338" y="80" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="351" y="80" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="325" y="92" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="338" y="92" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="351" y="92" width="4" height="4" fill="url(#mWinWarm)"/>

      <!-- Tower 7: Stepped High-Rise Windows -->
      <rect x="382" y="96" width="3" height="4.5" rx="0.5"/>
      <rect x="394" y="96" width="3" height="4.5" rx="0.5"/>
      <rect x="406" y="96" width="3" height="4.5" rx="0.5"/>
      <rect x="418" y="96" width="3" height="4.5" rx="0.5"/>
      <rect x="382" y="112" width="3" height="4.5" rx="0.5"/>
      <rect x="394" y="112" width="3" height="4.5" rx="0.5"/>
      <rect x="406" y="112" width="3" height="4.5" rx="0.5"/>
      <rect x="418" y="112" width="3" height="4.5" rx="0.5"/>
      <rect x="382" y="128" width="3" height="4.5" rx="0.5"/>
      <rect x="394" y="128" width="3" height="4.5" rx="0.5"/>
      <rect x="406" y="128" width="3" height="4.5" rx="0.5"/>
      <rect x="418" y="128" width="3" height="4.5" rx="0.5"/>
    </g>

    <!-- Breathing Midnight Windows Group -->
    <g id="m-win-breathe" opacity="0.9">
      <animate attributeName="opacity" values="0.95;0.45;0.95" dur="3.4s" repeatCount="indefinite" />
      <rect x="206" y="76" width="22" height="2.5" rx="0.5" fill="#fef08a"/>
      <rect x="145" y="70" width="12" height="2" rx="0.5" fill="#fef08a"/>
      <rect x="217" y="52" width="14" height="2.5" rx="0.5" fill="#fef08a"/>
      <rect x="338" y="130" width="4" height="4" fill="url(#mWinWarm)"/>
      <rect x="351" y="130" width="4" height="4" fill="url(#mWinWarm)"/>
    </g>
  </g>

  <!-- Cool Cyan Glass Reflections -->
  <g fill="url(#mWinCyan)">
    <rect x="27" y="65" width="6" height="3" rx="0.5"/>
    <rect x="27" y="85" width="6" height="3" rx="0.5"/>
    <rect x="27" y="105" width="6" height="3" rx="0.5"/>
    <rect x="268" y="100" width="16" height="2.5" rx="0.5" opacity="0.7">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.6s" repeatCount="indefinite" />
    </rect>
  </g>
  <!-- Ground Baseline -->
  <line x1="0" y1="180" x2="440" y2="180" stroke="#334155" stroke-width="2.5"/>
</svg>
